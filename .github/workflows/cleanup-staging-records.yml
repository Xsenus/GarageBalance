name: Cleanup staging test records

on:
  workflow_dispatch:
    inputs:
      kind:
        description: "garage-history: archived garages with accruals and payments; meter-history: all readings and meter replacements"
        required: true
        type: choice
        options:
          - garage-history
          - meter-history
      operation:
        description: preview lists what will change without changes; cleanup executes exactly that previewed plan
        required: true
        type: choice
        default: preview
        options:
          - preview
          - cleanup
      confirmation:
        description: "PREVIEW|DELETE GARAGEBALANCE DELETED GARAGE HISTORY or PREVIEW|DELETE GARAGEBALANCE METER HISTORY"
        required: true
        type: string
      fingerprint:
        description: Plan fingerprint printed by the preview (cleanup only)
        required: false
        type: string

concurrency:
  group: garagebalance-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cleanup:
    name: Preview or clean up staging test records
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging

    steps:
      - name: Validate inputs
        env:
          KIND: ${{ inputs.kind }}
          OPERATION: ${{ inputs.operation }}
          CONFIRMATION: ${{ inputs.confirmation }}
          FINGERPRINT: ${{ inputs.fingerprint }}
        run: |
          if [[ "$KIND" == "garage-history" ]]; then
            subject="DELETED GARAGE HISTORY"
          else
            test "$KIND" = "meter-history"
            subject="METER HISTORY"
          fi
          if [[ "$OPERATION" == "preview" ]]; then
            test "$CONFIRMATION" = "PREVIEW GARAGEBALANCE ${subject}"
          else
            test "$OPERATION" = "cleanup"
            test "$CONFIRMATION" = "DELETE GARAGEBALANCE ${subject}"
            [[ "$FINGERPRINT" =~ ^[0-9a-f]{64}$ ]]
          fi

      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/garagebalance_staging
          chmod 600 ~/.ssh/garagebalance_staging
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host garagebalance-staging
            HostName ${{ secrets.VPS_HOST }}
            User ${{ secrets.VPS_DEPLOY_USER }}
            IdentityFile ~/.ssh/garagebalance_staging
            ServerAliveInterval 15
            ServerAliveCountMax 4
            ConnectTimeout 20
          EOF
          chmod 600 ~/.ssh/config

      - name: Preview test records
        if: ${{ inputs.operation == 'preview' }}
        env:
          KIND: ${{ inputs.kind }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: >-
          ssh garagebalance-staging
          "sudo /usr/local/bin/garagebalance-deploy-apply records '${KIND}' preview '${CONFIRMATION}'"

      - name: Clean up the previewed plan
        if: ${{ inputs.operation == 'cleanup' }}
        env:
          KIND: ${{ inputs.kind }}
          CONFIRMATION: ${{ inputs.confirmation }}
          FINGERPRINT: ${{ inputs.fingerprint }}
        run: >-
          ssh garagebalance-staging
          "sudo /usr/local/bin/garagebalance-deploy-apply records '${KIND}' cleanup '${CONFIRMATION}' '${FINGERPRINT}'"

      - name: Verify public staging
        run: |
          curl --http2 --compressed --fail --silent --show-error \
            --connect-timeout 10 --max-time 20 \
            https://sgk.blagodaty.ru/health/ready
          curl --http2 --compressed --fail --silent --show-error \
            --connect-timeout 10 --max-time 20 \
            https://sgk.blagodaty.ru/ --output /dev/null
