name: Audit staging database

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type AUDIT GARAGEBALANCE STAGING
        required: true
        type: string
      backup_file:
        description: Optional operational backup file name to audit instead of a fresh dump
        required: false
        default: ""
        type: string

concurrency:
  group: garagebalance-staging-maintenance
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  audit:
    name: Back up and audit a restored database copy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    steps:
      - name: Validate inputs
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          BACKUP_FILE: ${{ inputs.backup_file }}
        run: |
          test "$CONFIRMATION" = "AUDIT GARAGEBALANCE STAGING"
          if [ -n "$BACKUP_FILE" ]; then
            [[ "$BACKUP_FILE" =~ ^garagebalance_[0-9]{8}-[0-9]{6}_[a-z0-9_]+\.pgdump$ ]]
          fi

      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/garagebalance_staging
          chmod 600 ~/.ssh/garagebalance_staging
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Audit restored PostgreSQL copy
        env:
          BACKUP_FILE: ${{ inputs.backup_file }}
        run: |
          ssh -i ~/.ssh/garagebalance_staging \
            "${{ secrets.VPS_DEPLOY_USER }}@${{ secrets.VPS_HOST }}" \
            "sudo /usr/local/bin/garagebalance-deploy-apply audit-database 'AUDIT GARAGEBALANCE STAGING' ${BACKUP_FILE}"

      - name: Verify deployed application
        run: |
          curl --fail --silent --show-error --connect-timeout 10 --max-time 20 \
            https://sgk.blagodaty.ru/health/ready >/dev/null
          curl --fail --silent --show-error --connect-timeout 10 --max-time 20 \
            https://sgk.blagodaty.ru/ >/dev/null
