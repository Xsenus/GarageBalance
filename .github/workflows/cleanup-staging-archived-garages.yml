name: Cleanup staging archived garages

on:
  workflow_dispatch:
    inputs:
      operation:
        description: preview lists what can be deleted without changes; cleanup deletes exactly that previewed plan
        required: true
        type: choice
        default: preview
        options:
          - preview
          - cleanup
      confirmation:
        description: "preview: PREVIEW GARAGEBALANCE ARCHIVED GARAGES; cleanup: DELETE GARAGEBALANCE ARCHIVED GARAGES"
        required: true
        type: string
      fingerprint:
        description: Plan fingerprint printed by the preview (cleanup only)
        required: false
        type: string

concurrency:
  group: garagebalance-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cleanup:
    name: Preview or clean up archived garages without financial history
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging

    steps:
      - name: Validate inputs
        env:
          OPERATION: ${{ inputs.operation }}
          CONFIRMATION: ${{ inputs.confirmation }}
          FINGERPRINT: ${{ inputs.fingerprint }}
        run: |
          if [[ "$OPERATION" == "preview" ]]; then
            test "$CONFIRMATION" = "PREVIEW GARAGEBALANCE ARCHIVED GARAGES"
          else
            test "$OPERATION" = "cleanup"
            test "$CONFIRMATION" = "DELETE GARAGEBALANCE ARCHIVED GARAGES"
            [[ "$FINGERPRINT" =~ ^[0-9a-f]{64}$ ]]
          fi

      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/garagebalance_staging
          chmod 600 ~/.ssh/garagebalance_staging
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host garagebalance-staging
            HostName ${{ secrets.VPS_HOST }}
            User ${{ secrets.VPS_DEPLOY_USER }}
            IdentityFile ~/.ssh/garagebalance_staging
            ServerAliveInterval 15
            ServerAliveCountMax 4
            ConnectTimeout 20
          EOF
          chmod 600 ~/.ssh/config

      - name: Preview archived garages
        if: ${{ inputs.operation == 'preview' }}
        run: >-
          ssh garagebalance-staging
          "sudo /usr/local/bin/garagebalance-deploy-apply archived-garages preview 'PREVIEW GARAGEBALANCE ARCHIVED GARAGES'"

      - name: Clean up the previewed plan
        if: ${{ inputs.operation == 'cleanup' }}
        env:
          FINGERPRINT: ${{ inputs.fingerprint }}
        run: >-
          ssh garagebalance-staging
          "sudo /usr/local/bin/garagebalance-deploy-apply archived-garages cleanup 'DELETE GARAGEBALANCE ARCHIVED GARAGES' '${FINGERPRINT}'"

      - name: Verify public staging
        run: |
          curl --http2 --compressed --fail --silent --show-error \
            --connect-timeout 10 --max-time 20 \
            https://sgk.blagodaty.ru/health/ready
          curl --http2 --compressed --fail --silent --show-error \
            --connect-timeout 10 --max-time 20 \
            https://sgk.blagodaty.ru/ --output /dev/null
