name: Deploy staging

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  FRONTEND_DIR: frontend
  API_PROJECT: backend/GarageBalance.Api/GarageBalance.Api.csproj
  RELEASE_ID: ${{ github.sha }}-${{ github.run_number }}

jobs:
  backend:
    name: Backend tests and package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: garagebalance-staging-${{ github.ref }}-backend
      cancel-in-progress: true

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: garagebalance_test
          POSTGRES_PASSWORD: garagebalance_test_password
          POSTGRES_DB: garagebalance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U garagebalance_test -d garagebalance_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      GARAGEBALANCE_POSTGRES_TEST_CONNECTION: Host=127.0.0.1;Port=5432;Database=garagebalance_test;Username=garagebalance_test;Password=garagebalance_test_password

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore backend
        run: |
          dotnet restore GarageBalance.slnx
          dotnet tool restore

      - name: Test backend
        shell: pwsh
        run: |
          dotnet test GarageBalance.slnx --configuration Release --no-restore `
            --collect:"XPlat Code Coverage" `
            --settings backend-coverage.runsettings `
            --results-directory artifacts/coverage-backend
          ./infrastructure/scripts/verify-backend-coverage.ps1 `
            -ResultsDirectory artifacts/coverage-backend

      - name: Generate idempotent migration SQL
        run: |
          mkdir -p artifacts
          dotnet tool run dotnet-ef migrations script --idempotent \
            --project "$API_PROJECT" \
            --startup-project "$API_PROJECT" \
            --output artifacts/deploy-migrations.sql
          test -s artifacts/deploy-migrations.sql

      - name: Publish backend
        run: |
          dotnet publish "$API_PROJECT" \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained true \
            --output artifacts/api
          test -x artifacts/api/GarageBalance.Api

      - name: Package backend release
        run: |
          tar -czf artifacts/api.tar.gz -C artifacts/api .
          tar -czf artifacts/operations.tar.gz \
            infrastructure/deployment \
            infrastructure/scripts/garagebalance-healthcheck.sh \
            infrastructure/scripts/garagebalance-performance-check.sh \
            infrastructure/scripts/prepare-staging-showcase.sh \
            infrastructure/scripts/cleanup-staging-codex-records.sh \
            infrastructure/scripts/audit-staging-database.sh \
            infrastructure/scripts/install-vps-performance-configuration.sh \
            infrastructure/scripts/vps-apply-release.sh
          test -s artifacts/api.tar.gz
          test -s artifacts/operations.tar.gz

      - name: Upload backend release
        uses: actions/upload-artifact@v6
        with:
          name: garagebalance-staging-backend-${{ github.sha }}
          path: |
            artifacts/api.tar.gz
            artifacts/deploy-migrations.sql
            artifacts/operations.tar.gz
          retention-days: 1
          compression-level: 0

  frontend:
    name: Frontend tests and package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: garagebalance-staging-${{ github.ref }}-frontend
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm ci --prefer-offline --no-audit

      - name: Test frontend
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm run test:coverage

      - name: Lint frontend
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm run lint

      - name: Build frontend
        working-directory: ${{ env.FRONTEND_DIR }}
        run: |
          npm run build
          npm run check:bundle

      - name: Package frontend release
        run: |
          mkdir -p artifacts
          tar -czf artifacts/frontend.tar.gz -C frontend/dist .
          test -s artifacts/frontend.tar.gz

      - name: Upload frontend release
        uses: actions/upload-artifact@v6
        with:
          name: garagebalance-staging-frontend-${{ github.sha }}
          path: artifacts/frontend.tar.gz
          retention-days: 1
          compression-level: 0

  backend-quality:
    name: Backend audit, privacy and formatting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: garagebalance-staging-${{ github.ref }}-backend-quality
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore backend
        run: dotnet restore GarageBalance.slnx

      - name: Audit backend dependencies
        run: dotnet list GarageBalance.slnx package --vulnerable --include-transitive

      - name: Check repository privacy
        shell: pwsh
        run: ./infrastructure/scripts/verify-package-privacy.ps1

      - name: Check backend formatting
        run: dotnet format GarageBalance.slnx --verify-no-changes --no-restore

  frontend-audit:
    name: Frontend dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: garagebalance-staging-${{ github.ref }}-frontend-audit
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Audit frontend dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: >-
          npm audit --package-lock-only --audit-level=high
          --fetch-retries=2 --fetch-timeout=60000
          --fetch-retry-mintimeout=1000 --fetch-retry-maxtimeout=10000

  deploy:
    name: Deploy verified staging release
    needs:
      - backend
      - frontend
      - backend-quality
      - frontend-audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    concurrency:
      group: garagebalance-staging-deploy
      cancel-in-progress: false

    steps:
      - name: Download backend release
        uses: actions/download-artifact@v8
        with:
          name: garagebalance-staging-backend-${{ github.sha }}
          path: artifacts

      - name: Download frontend release
        uses: actions/download-artifact@v8
        with:
          name: garagebalance-staging-frontend-${{ github.sha }}
          path: artifacts

      - name: Verify release artifacts
        run: |
          test -s artifacts/api.tar.gz
          test -s artifacts/frontend.tar.gz
          test -s artifacts/deploy-migrations.sql
          test -s artifacts/operations.tar.gz

      - name: Upload combined release artifact
        uses: actions/upload-artifact@v6
        with:
          name: garagebalance-staging-${{ github.sha }}
          path: |
            artifacts/api.tar.gz
            artifacts/frontend.tar.gz
            artifacts/deploy-migrations.sql
            artifacts/operations.tar.gz
          retention-days: 30
          compression-level: 0

      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/garagebalance_staging
          chmod 600 ~/.ssh/garagebalance_staging
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host garagebalance-staging
            HostName ${{ secrets.VPS_HOST }}
            User ${{ secrets.VPS_DEPLOY_USER }}
            IdentityFile ~/.ssh/garagebalance_staging
            ControlMaster auto
            ControlPath ~/.ssh/garagebalance-staging-%C
            ControlPersist 120
            ServerAliveInterval 15
            ServerAliveCountMax 4
            ConnectTimeout 20
          EOF
          chmod 600 ~/.ssh/config

      - name: Upload artifacts to VPS
        run: |
          ssh garagebalance-staging "mkdir -p ~/uploads/${RELEASE_ID}"
          scp artifacts/api.tar.gz \
            "garagebalance-staging:~/uploads/${RELEASE_ID}/api.tar.gz"
          scp artifacts/frontend.tar.gz \
            "garagebalance-staging:~/uploads/${RELEASE_ID}/frontend.tar.gz"
          scp artifacts/deploy-migrations.sql \
            "garagebalance-staging:~/uploads/${RELEASE_ID}/deploy-migrations.sql"
          scp artifacts/operations.tar.gz \
            "garagebalance-staging:~/uploads/${RELEASE_ID}/operations.tar.gz"

      - name: Apply release on VPS
        run: |
          ssh garagebalance-staging \
            "sudo /usr/local/bin/garagebalance-deploy-apply '${RELEASE_ID}'"
          ssh -O exit garagebalance-staging || true
          ENTRY_ASSET="$(tar -xOf artifacts/frontend.tar.gz ./index.html | grep -oE '"/assets/[^"]+"' | head -n 1 | tr -d '"')"
          test -n "${ENTRY_ASSET}"
          for ATTEMPT in 1 2 3; do
            curl --http2 --compressed --fail --silent --show-error \
              --connect-timeout 10 --max-time 20 \
              "https://sgk.blagodaty.ru${ENTRY_ASSET}?deployment=${GITHUB_SHA}-${ATTEMPT}" \
              --output /dev/null
          done
