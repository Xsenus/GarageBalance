limit_req_zone $binary_remote_addr zone=garagebalance_api_rate:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=garagebalance_per_ip:10m;

upstream garagebalance_staging_backend {
    server 127.0.0.1:3101;
    keepalive 16;
}

server {
    listen 443 ssl http2;
    server_name sgk.blagodaty.ru;

    root /opt/garagebalance-staging/frontend;
    index index.html;

    access_log /var/log/garagebalance-nginx/garagebalance-staging-timing.log garagebalance_timing;
    error_log /var/log/garagebalance-nginx/garagebalance-staging-error.log warn;

    client_max_body_size 50m;
    client_header_timeout 10s;
    client_body_timeout 30s;
    send_timeout 30s;
    keepalive_timeout 65s;
    keepalive_requests 1000;
    limit_conn garagebalance_per_ip 30;
    limit_conn_status 429;
    limit_req_status 429;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss image/svg+xml;

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Request-ID $request_id always;
    }

    location = /health {
        proxy_pass http://garagebalance_staging_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Error-ID $request_id;
        proxy_connect_timeout 3s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
        proxy_next_upstream off;
        add_header Cache-Control "no-store" always;
        add_header X-Request-ID $request_id always;
    }

    location /api/ {
        limit_req zone=garagebalance_api_rate burst=40 nodelay;
        proxy_pass http://garagebalance_staging_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Error-ID $request_id;
        proxy_connect_timeout 3s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_next_upstream off;
        proxy_buffering on;
        proxy_buffers 16 16k;
        proxy_busy_buffers_size 64k;
        add_header Cache-Control "no-store" always;
        add_header X-Request-ID $request_id always;
    }

    location = /index.html {
        etag off;
        if_modified_since off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header X-Request-ID $request_id always;
        try_files /index.html =404;
    }

    location / {
        etag off;
        if_modified_since off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header X-Request-ID $request_id always;
        try_files $uri $uri/ /index.html;
    }

    ssl_certificate /etc/letsencrypt/live/sgk.blagodaty.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sgk.blagodaty.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name sgk.blagodaty.ru;
    return 301 https://$host$request_uri;
}
